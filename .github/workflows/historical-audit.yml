name: Historical knowledge audit (read-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/audit_historical_claims.py
      - .github/workflows/historical-audit.yml
  schedule:
    - cron: '35 4 2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit historical claims and current research debt
        run: python -m scripts.audit_historical_claims
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-audit-report
          path: historical_audit/
          retention-days: 30
