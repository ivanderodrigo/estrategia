name: Daily Failure Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_daily.py'
      - 'engine/research/planner.py'
      - 'tests/test_query_discovery_v440.py'
      - 'tests/test_v422_tag_ergonomics.py'
      - 'scripts/audit_v422.py'
      - 'scripts/audit_v430.py'
      - '.github/workflows/daily-diagnostics.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install prerequisites
        id: dependencies
        continue-on-error: true
        run: python -m pip install -r requirements.txt
      - name: Determine failing preflight step
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: python scripts/diagnose_daily.py
      - name: Report missing dependencies
        if: steps.dependencies.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/current/daily_preflight_health.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'conclusion':'failed','failed_step':'dependencies',
            'scope':'Preflight only','steps':[]},indent=2)+'\n')
          PY
      - name: Prepare diagnostic artifact even on failure
        if: always()
        run: |
          if [ ! -f data/current/daily_preflight_health.json ]; then
            echo '{"conclusion":"failed","failed_step":"workflow_setup"}' > data/current/daily_preflight_health.json
          fi
      - name: Upload preflight diagnostic without mutating main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-preflight-diagnostic-${{ github.run_id }}
          path: data/current/daily_preflight_health.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail if any prerequisite failed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/current/daily_preflight_health.json').read_text())
          assert report.get('conclusion')=='passed', report.get('failed_step')
          PY
