name: Daily Failure Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_daily.py'
      - 'engine/research/planner.py'
      - 'tests/test_query_discovery_v440.py'
      - 'tests/test_v422_tag_ergonomics.py'
      - 'scripts/audit_v422.py'
      - '.github/workflows/daily-diagnostics.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install prerequisites
        id: dependencies
        continue-on-error: true
        run: python -m pip install -r requirements.txt
      - name: Determine failing preflight step
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: python scripts/diagnose_daily.py
      - name: Report missing dependencies
        if: steps.dependencies.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/current/daily_preflight_health.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({'conclusion':'failed','failed_step':'dependencies',
            'scope':'Preflight only','steps':[]},indent=2)+'\n')
          PY
      - name: Persist diagnostic even on failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/current/daily_preflight_health.json ]; then
            echo '{"conclusion":"failed","failed_step":"workflow_setup"}' > data/current/daily_preflight_health.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current/daily_preflight_health.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: persist daily preflight diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if any prerequisite failed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/current/daily_preflight_health.json').read_text())
          assert report.get('conclusion')=='passed', report.get('failed_step')
          PY
