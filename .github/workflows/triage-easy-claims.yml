name: Triage Easy-to-Corroborate Claims
on:
  push:
    branches: [main]
    paths:
      - 'scripts/triage_easy_claims.py'
      - '.github/workflows/triage-easy-claims.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westcon-claim-triage
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Analyze exact unsupported claims and official source coverage
        run: python scripts/triage_easy_claims.py
      - name: Publish compact triage report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current/easy_claims_triage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: classify easy-to-corroborate claims'
          git pull --rebase origin main
          git push origin HEAD:main
