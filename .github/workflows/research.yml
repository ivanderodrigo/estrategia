name: Refresh public strategy evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Collect public evidence
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/research.py
      - name: Commit refreshed evidence
        run: |
          git config user.name "westcon-strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.latest.json data/history/
          git diff --cached --quiet || git commit -m "chore: refresh public strategy evidence"
          git push
