name: Recover News Publication Dates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-publication-date-backfill.yml'
      - 'scripts/backfill_news_publication_dates.py'
  schedule:
    - cron: '11 2 * * 0'
permissions:
  contents: write
concurrency:
  group: westcon-intelligence-research
  queue: max
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Revisit original news articles and inspect publication metadata
        run: python -m scripts.backfill_news_publication_dates --limit 180
      - name: Publish dates independently of claims and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public/news_publication_dates.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: recover source-published dates for existing news'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
