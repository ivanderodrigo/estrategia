name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate workflows
        run: python scripts/validate_workflows.py
      - name: Validate canonical data
        run: python scripts/validate.py
      - name: Security audit
        run: python scripts/security_audit.py
      - name: v4.1 source and preservation audit
        run: python scripts/audit_release_v410.py
      - name: Frontend syntax
        run: node --check assets/app/intelligence.js
      - name: Frontend smoke
        run: node tests/ui_smoke.js
      - name: Filter builder and exact-subset report
        run: node tests/filter_builder_v410.js
