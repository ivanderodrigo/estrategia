name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate workflows
        run: python scripts/validate_workflows.py
      - name: Validate canonical data
        run: python scripts/validate.py
      - name: Security audit
        run: python scripts/security_audit.py
      - name: v4.1 source and preservation audit
        run: python scripts/audit_release_v410.py
      - name: Audit published claim-to-source bindings
        run: |
          python scripts/audit_claim_sources.py --output claim-source-audit.json > /dev/null
          python -c "import json; d=json.load(open('claim-source-audit.json')); print({k:v['counts'] for k,v in d['sections'].items()})"
      - name: Upload claim-source audit
        uses: actions/upload-artifact@v4
        with:
          name: claim-source-audit
          path: claim-source-audit.json
          retention-days: 14
      - name: Individually assess historical source/claim excerpts across sections
        run: python scripts/accredit_semantic_historical_sources.py
      - name: Rebuild and validate proposed canonical snapshot
        run: |
          if ! python -m engine.pipeline; then
            python -c "import json; p='data/current/knowledge_preservation_failure.json'; d=json.load(open(p)); print('PRESERVATION MISSING:', json.dumps(d.get('missing',{}), ensure_ascii=False, indent=2))"
            exit 1
          fi
          python scripts/validate.py
          python scripts/validate_active_portfolio_public.py
          python scripts/validate_mass_historical_publication.py
          python scripts/audit_published_topic_markets.py
          python scripts/audit_published_issuer_competitors.py
          python scripts/audit_published_semantic_historical.py
          python scripts/audit_published_peer_competitors.py
          PYTHONPATH=. python scripts/report_gap_targets.py
          python scripts/audit_historical_reuse_20261113.py
          python scripts/audit_claim_sources.py --output claim-source-rebuilt.json > /dev/null
      - name: Audit published snapshot consistency
        run: python scripts/audit_public_consistency.py
      - name: Frontend syntax
        run: node --check assets/app/intelligence.js
      - name: Frontend smoke
        run: |
          node tests/ui_smoke.js
          node tests/business_intelligence_v61.js
          node tests/audit_intelligence_v64.js
          node tests/command_center_audit_v64.js
          node tests/news_coverage_v64.js
          node tests/distributor_scope_audit.js
          node tests/distributor_linecard_audit_v65.js
      - name: Filter builder and exact-subset report
        run: node tests/filter_builder_v410.js
