
name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ["index.html","404.html","assets/**","data/current/intelligence.json","data/current/last_run.json"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate
        run: python scripts/validate.py
      - name: Build public site
        run: |
          mkdir -p _site/assets/app _site/data/current
          cp index.html 404.html _site/
          cp assets/favicon.svg _site/assets/
          cp assets/app/intelligence.css assets/app/intelligence.js _site/assets/app/
          cp data/current/intelligence.json data/current/last_run.json _site/data/current/
          [ -f CNAME ] && cp CNAME _site/CNAME || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
