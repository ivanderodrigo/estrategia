name: Publicar Business Intelligence en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/v315/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_run:
    workflows:
      - "Inteligencia pública diaria"
      - "Investigación estratégica profunda semanal"
      - "Inteligencia exhaustiva mensual"
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout de la última main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Preparar sitio público mínimo
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/
          cp -R assets _site/assets
          cp -R data/v315 _site/data/v315
          [ -f CNAME ] && cp CNAME _site/CNAME || true
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
