name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ["index.html","404.html","memoria-historica.html","assets/**","engine/**","config/current/**","tests/**","scripts/**",".github/workflows/pages-deploy.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Westcon Intelligence Daily", "Westcon Intelligence Weekly", "Westcon Intelligence Monthly"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test application
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node tests/observatory.js
          node tests/ui_smoke.js
          node tests/business_intelligence_v61.js
          node tests/audit_intelligence_v64.js
          node tests/command_center_audit_v64.js
          node tests/news_coverage_v64.js
          node tests/distributor_linecard_audit_v65.js
          node tests/filter_builder_v410.js
      - name: Individually accredit structured historical competitor links
        run: python scripts/accredit_structured_historical.py --limit 30 --timeout 9
      - name: Individually assess historical source/claim excerpts across all sections
        run: python scripts/accredit_semantic_historical_sources.py
      - name: Rebuild accredited intelligence
        run: python -m engine.pipeline
      - name: Validate
        run: |
          python scripts/validate_workflows.py
          python scripts/validate.py
      - name: Validate active portfolio and competitive mapping in published JSON
        run: python scripts/validate_active_portfolio_public.py
      # Persist the actual compiled snapshot. GitHub Pages can also be configured
      # to publish directly from /main; without this commit it serves old data.
      # Do not trigger on data/public/** alone to avoid a self-rebuild loop.
      - name: Validate 85 historical competitors in final public JSON
        run: python scripts/audit_published_historical_market.py
      - name: Validate 48 topic market facts in published JSON
        run: python scripts/audit_published_topic_markets.py
      - name: Validate all semantically accredited historic claims in published JSON
        run: python scripts/audit_published_semantic_historical.py
      - name: Validate mass archived-source sidecars
        run: python scripts/validate_mass_historical_publication.py
      - name: Commit rebuilt public data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A parallel historical source audit can update only its two source
          # check reports. Preserve those newer checks and safely move our
          # generated public snapshot onto that newer commit, while refusing
          # any concurrent changes to code or other intelligence.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            while IFS= read -r changed; do
              [ -n "$changed" ] || continue
              case "$changed" in
                data/current/historical_source_checks.json|data/public/historical/current/source_checks.json) ;;
                *) echo "Main changed outside source audit ($changed): refusing stale publish"; exit 1 ;;
              esac
            done < <(git diff --name-only HEAD origin/main)
            git restore --source=origin/main --worktree -- data/public/historical/current/source_checks.json
            git reset --soft origin/main
          fi
          git add -A data/public config/current/historical_structured_verified.json config/current/historical_semantic_verified.json
          if ! git diff --cached --quiet; then
            git commit -m "data: persist validated public intelligence snapshot [skip ci]"
            git push origin HEAD:main
          fi
      - name: Build public site
        run: |
          mkdir -p _site/assets/app _site/data/public
          cp index.html 404.html memoria-historica.html _site/
          cp assets/favicon.svg _site/assets/
          cp -R assets/app/. _site/assets/app/
          cp -R data/public/* _site/data/public/
          [ -f CNAME ] && cp CNAME _site/CNAME || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
