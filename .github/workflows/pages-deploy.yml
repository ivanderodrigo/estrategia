name: Deploy Pages
# Deployment consumes one already-validated snapshot. Research workflows own
# crawling, accreditation, rebuilding and publishing data/public to main.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'memoria-historica.html'
      - 'assets/**'
      # Wait for an atomic canonical rebuild; historical sidecars alone are
      # intermediate research results and can precede a public snapshot.
      - 'data/public/manifest.json'
      - 'data/public/sections/**'
      - 'data/public/audit_integrity.json'
      - 'CNAME'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Westcon Intelligence Daily'
      - 'Westcon Intelligence Weekly'
      - 'Westcon Intelligence Monthly'
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: westcon-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify published snapshot and frontend
        run: |
          python scripts/audit_app_structure.py
          python scripts/validate.py
          python scripts/audit_public_consistency.py --output /tmp/westcon-deploy-integrity.json
          python scripts/validate_active_portfolio_public.py
          python scripts/audit_competitor_portfolio_separation.py
          python scripts/audit_full_visible_source_coverage.py
          python scripts/audit_published_historical_market.py
          python scripts/audit_published_topic_markets.py
          python scripts/audit_published_peer_competitors.py
          python scripts/audit_published_semantic_historical.py
          python scripts/audit_published_issuer_competitors.py
          python scripts/validate_mass_historical_publication.py
          node tests/observatory.js
          node tests/ui_smoke.js
          node tests/confidence_color_consistency.js
          node tests/sase_vendor_render.js
          node tests/business_intelligence_v61.js
          node tests/audit_intelligence_v64.js
          node tests/command_center_audit_v64.js
          node tests/news_coverage_v64.js
          node tests/distributor_linecard_audit_v65.js
          node tests/filter_builder_v410.js
      - name: Build immutable site from checked-out main
        run: |
          mkdir -p _site/assets/app _site/data/public
          cp index.html 404.html memoria-historica.html _site/
          cp assets/favicon.svg _site/assets/
          cp -R assets/app/. _site/assets/app/
          cp -R data/public/. _site/data/public/
          [ -f CNAME ] && cp CNAME _site/CNAME || true
          echo "Publishing commit $(git rev-parse HEAD)"
          test -s _site/data/public/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
