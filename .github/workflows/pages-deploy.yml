name: Deploy Pages
on:
  push:
    branches: [main]
    paths: ["index.html","404.html","memoria-historica.html","assets/**","data/public/**","scripts/validate.py","scripts/validate_workflows.py",".github/workflows/pages-deploy.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Westcon Intelligence Daily", "Westcon Intelligence Weekly", "Westcon Intelligence Monthly"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test application
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          node tests/observatory.js
          node tests/ui_smoke.js
          node tests/filter_builder_v410.js
      - name: Rebuild accredited intelligence
        run: python -m engine.pipeline
      - name: Validate
        run: |
          python scripts/validate_workflows.py
          python scripts/validate.py
      - name: Build public site
        run: |
          mkdir -p _site/assets/app _site/data/public
          cp index.html 404.html memoria-historica.html _site/
          cp assets/favicon.svg _site/assets/
          cp -R assets/app/. _site/assets/app/
          cp -R data/public/* _site/data/public/
          [ -f CNAME ] && cp CNAME _site/CNAME || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
