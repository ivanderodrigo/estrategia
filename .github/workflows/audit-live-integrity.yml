name: Westcon Published Integrity Monitor

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-integrity.yml'
      - 'scripts/audit_public_consistency.py'

permissions:
  contents: write

concurrency:
  group: westcon-published-integrity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate a single published snapshot and publish its actual audit time
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Never refresh timestamps if the data is inconsistent.
            python scripts/audit_public_consistency.py
            python scripts/audit_competitor_portfolio_separation.py
            python scripts/validate_active_portfolio_public.py
            git add data/public/audit_integrity.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit: recheck published integrity against current snapshot [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Main changed during the audit; recheck full current snapshot"
          done
          exit 1
