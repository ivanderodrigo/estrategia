name: Historical Source Diligence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/revalidate_historical_sources.py'
      - 'scripts/accredit_semantic_historical_sources.py'
      - '.github/workflows/historical-source-diligence.yml'
  schedule:
    - cron: '37 3 * * 1,4'
permissions:
  contents: write
concurrency:
  group: historical-source-diligence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install prerequisites
        run: python -m pip install -r requirements.txt
      - name: Enumerate all visible and historical claim-source pairs
        run: python scripts/audit_full_visible_source_coverage.py
      - name: Audit the full source URL inventory with individual claim checks
        run: >-
          python scripts/revalidate_historical_sources.py
          --limit 100000 --timeout 5 --workers 12
      - name: Verify each automatic accreditation is a structurally explicit Gartner product alternative
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          report = json.loads(Path('data/current/historical_source_checks.json').read_text(encoding='utf-8'))
          assert report['urls_checked_this_run'] >= 1
          assert report['urls_checked_this_run'] == report['urls_in_inventory']
          accredited = 0
          for url, page in report['results'].items():
              assert page['accreditation'] == 'NOT_ACCREDITED'  # A page alone never establishes a relationship.
              for item in page.get('claim_checks') or []:
                  if item.get('accredited'):
                      accredited += 1
                      assert item['status'] == 'VERIFIED_EXPLICIT_ALTERNATIVE'
                      assert item['section'] == 'manufacturers' and item['field'] == 'competitors'
                      assert urlparse(url).hostname in {'www.gartner.com','gartner.com'}
                      assert urlparse(url).path.startswith('/reviews/product/')
                      assert urlparse(url).path.rstrip('/').endswith('/alternatives')
                      assert item.get('matched_vendor')
          print('Audited', report['urls_checked_this_run'],'URLs and',
                report['claims_checked_this_run'],'claim-source pairs,',
                accredited,'explicit product alternatives')
          PY
      - name: Verify every reachable claim in its source context across sections
        run: python scripts/accredit_semantic_historical_sources.py
      - name: Publish source checks without overwriting intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Save only the four outputs owned by diligence. Never rebase a
          # generated snapshot onto conflicting Pages-generated JSON files.
          output_dir="$RUNNER_TEMP/historical-source-audit"
          files=(
            data/current/historical_source_checks.json
            data/public/historical/current/source_checks.json
            config/current/historical_semantic_verified.json
            data/public/historical/current/semantic_claim_audit.json data/public/historical/current/full_source_inventory_coverage.json
          )
          mkdir -p "$output_dir"
          for file in "${files[@]}"; do
            mkdir -p "$output_dir/$(dirname "$file")"
            cp "$file" "$output_dir/$file"
          done
          for attempt in 1 2 3 4; do
            # Reapply the audited artifacts on the very latest main, preserving
            # any simultaneous application changes and Pages-published data.
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              cp "$output_dir/$file" "$file"
            done
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo "Historical source audit already up to date"
              exit 0
            fi
            git commit -m 'research: revalidate individually sourced historical claims [skip ci]'
            if git push origin HEAD:main; then
              echo "Published audited sources on current main"
              exit 0
            fi
            echo "Main advanced while publishing audit; reconciling attempt $attempt"
            sleep 2
          done
          echo "Source audit could not publish without racing another update"
          exit 1
