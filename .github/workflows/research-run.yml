name: Reusable Intelligence Research

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      max_runtime:
        required: true
        type: number
      fallback_runtime:
        required: true
        type: number
      timeout_minutes:
        required: true
        type: number
      commit_message:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: westcon-intelligence-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Focused research regression checks
        run: |
          python -m unittest discover -s tests -p "test_research_query_budget_initialization.py" -v
          python -m unittest discover -s tests -p "test_supervisor_research_outcome.py" -v
          python -m unittest discover -s tests -p "test_debt_aware_growth.py" -v
          python -m unittest discover -s tests -p "test_planner_claim_corroboration_priority.py" -v
      - name: Canonical preflight
        run: |
          python -m compileall -q engine scripts tests
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee full-test-results.txt
          test ${PIPESTATUS[0]} -eq 0
          python scripts/validate_workflows.py
          python scripts/security_audit.py
          python scripts/validate.py
          python scripts/audit_release_v410.py
          python -m scripts.audit_v421
          python -m scripts.audit_v422
          python -m scripts.audit_v430
          node --check assets/app/intelligence.js
          node tests/ui_smoke.js
          node tests/business_intelligence_v61.js
          node tests/filter_builder_v410.js
      - name: Research with watchdog
        run: >-
          python scripts/research_supervisor.py
          --profile "${{ inputs.profile }}"
          --max-runtime "${{ inputs.max_runtime }}"
          --fallback-runtime "${{ inputs.fallback_runtime }}"
      - name: Validate generated snapshot
        run: |
          python scripts/validate.py
          python scripts/audit_release_v410.py
          python -m scripts.audit_v421
          python -m scripts.audit_v422
          python -m scripts.audit_v430
          python -m unittest discover -s tests -p "test_*.py" -v
          node tests/ui_smoke.js
          node tests/business_intelligence_v61.js
          node tests/filter_builder_v410.js
      - name: Recheck historic sources against their live pages
        run: >-
          python scripts/revalidate_historical_sources.py
          --limit ${{ inputs.profile == 'daily' && 18 || inputs.profile == 'deep' && 32 || 48 }}
          --timeout 7
      - name: Validate independent research reports
        run: |
          python scripts/validate_mass_historical_publication.py
          python scripts/validate.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: research-diagnostics-${{ inputs.profile }}-${{ github.run_id }}
          path: |
            full-test-results.txt
            data/current/supervisor.json
            data/current/run_history.json
            data/current/research_ledger.json
            data/current/quality_report.json
            data/current/debt_diagnostic.json
            data/current/knowledge_preservation_failure.json
            data/current/quality_failure.json
            data/current/preservation_claim_trace.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish validated intelligence
        run: >-
          python scripts/publish_research_update.py
          --message "${{ inputs.commit_message }}"
          --attempts 3
