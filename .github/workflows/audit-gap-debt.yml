name: Gap Debt Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_gap_debt.py'
      - 'tests/test_audit_gap_debt.py'
      - '.github/workflows/audit-gap-debt.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    concurrency:
      group: westcon-debt-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate evidence debt accounting
        run: python -m unittest discover -s tests -p "test_audit_gap_debt.py" -v
      - name: Generate independent backlog diagnostic
        run: python scripts/audit_gap_debt.py
      - name: Publish audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current/debt_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: audit strategic evidence backlog'
          git pull --rebase origin main
          git push origin HEAD:main
