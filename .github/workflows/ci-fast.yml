name: Intelligence Fast CI
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'scripts/**'
      - 'tests/**'
      - 'config/current/**'
      - 'assets/app/**'
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: westcon-fast-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Validate Python and full test suite
        run: |
          python -m compileall -q engine scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee fast-ci-tests.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Validate workflows and dataset
        run: |
          python scripts/validate_workflows.py
          python scripts/validate.py
          python scripts/security_audit.py
          node --check assets/app/intelligence.js
          node --check assets/app/command-center.js
          node tests/ui_smoke.js
      - name: Keep failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-ci-${{ github.run_id }}
          path: fast-ci-tests.txt
          if-no-files-found: warn
          retention-days: 14
