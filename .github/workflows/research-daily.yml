name: Inteligencia pública diaria

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. Minuto no redondo para reducir retrasos de cola.
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: westcon-public-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install requests openpyxl
      - name: Investigación diaria
        env:
          RESEARCH_PROFILE: daily
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/research.py --profile=daily
      - name: Validar dataset antes de publicar
        run: python scripts/validate.py
      - name: Guardar actualización
        run: |
          git config user.name "westcon-strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.latest.json data/research_status.json data/changes.latest.json data/history/
          git diff --cached --quiet || git commit -m "chore: inteligencia pública diaria"
          git pull --rebase origin main
          git push origin HEAD:main
