name: Inteligencia pública diaria

on:
  workflow_dispatch:
  schedule:
    # Generado por scripts/configure_updates.py; la guardia elige horario de verano/invierno.
    # BEGIN CONFIGURABLE_SCHEDULE
    - cron: "23 4 * * *"
    - cron: "23 5 * * *"
    # END CONFIGURABLE_SCHEDULE

permissions:
  contents: write

concurrency:
  group: westcon-public-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comprobar calendario local
        id: schedule
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: python scripts/schedule_guard.py --profile daily
      - name: Dependencias
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Preflight offline del motor v3.12 y la UI v3.12.0
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m py_compile scripts/research.py scripts/configure_updates.py scripts/schedule_guard.py scripts/research_supervisor_v33.py scripts/research_supervisor_v38.py scripts/research_supervisor_v39.py scripts/research_supervisor_v312.py scripts/v34/*.py scripts/v38/*.py scripts/v39/*.py scripts/v312/*.py
          python scripts/test_resilience.py
          python scripts/test_schedule.py
          python -m unittest tests/test_v312.py
          python scripts/v312/validate_v312.py
          node --check assets/v312/intelligence.js
          node tests/ui_smoke_v312.js
      - name: Investigación diaria
        if: steps.schedule.outputs.run == 'true'
        env:
          RESEARCH_PROFILE: daily
        run: python scripts/research_supervisor_v312.py --profile daily --max-runtime 720 --fallback-runtime 0
      - name: Conservar diagnóstico de ejecución
        if: always() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-diagnostic-daily-${{ github.run_id }}
          path: |
            data/v31/
            data/v32/
            data/v33/
            data/v34/
            data/v37/
            data/v38/
            data/v39/
            data/v312/
            diagnostics/*.log
            data/run_manifest.latest.json
            data/supervisor.latest.json
            data/research_errors.json
            data/source_health.json
            data/discovered_entities.json
            data/research_status.json
            data/research_queue.json
          if-no-files-found: warn
          retention-days: 30
      - name: Validar dataset antes de publicar
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/v312/validate_v312.py
      - name: Guardar actualización
        if: steps.schedule.outputs.run == 'true'
        run: |
          python scripts/publish_research_update.py --message "chore: inteligencia pública diaria" --attempts 3
