name: Westcon Intelligence Daily

on:
  # One controlled research run whenever this workflow is explicitly maintained.
  # v6.2 verified-news and official-linecard update: one controlled Daily on merge.
  # Exercise new evidence-backed vendor relations and article discovery end-to-end.
  # v6.3: controlled first pass for curated mayoristas and verified news.
  # v6.4: controlled first pass for client, trend and architecture articles, full linecards.
  # v6.5: explicitly trigger evidence-first regional distributor linecard discovery.
  # v6.6: one controlled Daily to validate new regional linecard indexes and disambiguated OT/CPS queries.
  # v6.7: evidence-first fair-lane research smoke with all regional catalogue leads (stable code snapshot).
  # v6.1.1: retry the controlled research pass after aligning release identity and cache keys.
  # v7.0: controlled evidence-first Daily after official navigation and exact-claim source routing.
  # Validation regression recovery 2026-11-17: the dated Iberia
  # exclusion of Juniper/Ruckus supersedes the old FY27 first-party deck.
  # This change explicitly exercises the fixed canonical preflight on main.
  # Ordinary application/code commits never trigger the expensive crawler.
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-daily.yml'
      - '.github/workflows/research-run.yml'
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    uses: ./.github/workflows/research-run.yml
    with:
      profile: daily
      max_runtime: 720
      fallback_runtime: 0
      timeout_minutes: 35
      commit_message: "chore: inteligencia pública diaria"

  health:
    name: Record Daily outcome
    if: always()
    needs: research
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Persist exact failed step
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_OUTCOME: ${{ needs.research.result }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp > /tmp/daily_jobs.json
          python - <<'PY'
          import json, os
          from datetime import datetime,timezone
          from pathlib import Path
          jobs=[job for page in json.loads(Path('/tmp/daily_jobs.json').read_text()) for job in page['jobs']]
          researched=[job for job in jobs if 'research' in job.get('name','').lower()]
          failed=[{'job':job.get('name'), 'step':step.get('name'), 'conclusion':step.get('conclusion')}
                  for job in researched for step in job.get('steps',[])
                  if step.get('conclusion') in ('failure','cancelled','timed_out')]
          report={'generated_at':datetime.now(timezone.utc).isoformat(),
                  'run_id':os.environ['GITHUB_RUN_ID'],
                  'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
                  'research_job_result':os.environ.get('RESEARCH_OUTCOME'),
                  'failed_steps':failed,
                  'scope':'GitHub Actions job status; not proof of factual evidence yield'}
          dest=Path('data/current/daily_workflow_health.json')
          dest.parent.mkdir(parents=True,exist_ok=True)
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report=data/current/daily_workflow_health.json
          cp "$report" "$RUNNER_TEMP/daily-health.json"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            # A delayed health job must not replace the result of a newer run.
            if jq -e --argjson id "$GITHUB_RUN_ID" --argjson n "$GITHUB_RUN_ATTEMPT" '[(.run_id | tonumber), (.run_attempt // 1)] > [$id, $n]' "$report" >/dev/null; then
              exit 0
            fi
            cp "$RUNNER_TEMP/daily-health.json" "$report"
            git add "$report"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore: record Daily workflow outcome [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
