name: Westcon Intelligence Daily
on:
  schedule:
    - cron: '17 5 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westcon-research-daily
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Canonical preflight
        run: |
          python -m py_compile engine/*.py engine/research/*.py scripts/*.py
          python -m unittest tests/test_v319.py tests/test_workflows.py
          python scripts/validate.py
          node --check assets/app/intelligence.js
          node tests/ui_smoke_v319.js
      - name: Research daily
        run: python scripts/research_supervisor.py --profile daily --max-runtime 720 --fallback-runtime 0
      - name: Validate output
        run: python scripts/validate.py
      - name: Publish canonical intelligence only
        run: >-
          python scripts/publish_research_update.py --message "chore: inteligencia pública diaria" --attempts 3
