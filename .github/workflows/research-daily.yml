name: Westcon Intelligence Daily

on:
  # Validate changes to the research/build logic immediately after merging.
  # Research publications touch data/, not these paths, so this cannot
  # recursively trigger another Daily.
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'scripts/research_supervisor.py'
      - 'config/current/research_policy.json'
      - 'tests/test_research_query_budget_initialization.py'
      - 'tests/test_supervisor_research_outcome.py'
      - 'tests/test_debt_aware_growth.py'
      - 'tests/test_planner_claim_corroboration_priority.py'
      - '.github/workflows/research-run.yml'
      - '.github/workflows/research-daily.yml'
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    uses: ./.github/workflows/research-run.yml
    with:
      profile: daily
      max_runtime: 720
      fallback_runtime: 0
      timeout_minutes: 35
      commit_message: "chore: inteligencia pública diaria"
