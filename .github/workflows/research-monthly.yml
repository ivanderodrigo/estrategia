name: Westcon Intelligence Monthly
on:
  schedule:
    - cron: '41 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westcon-intelligence-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Canonical preflight
        run: |
          python -m py_compile engine/*.py engine/research/*.py scripts/*.py
          python -m unittest discover -s tests -p "test_*.py" -v
          python scripts/validate_workflows.py
          python scripts/validate.py
          node --check assets/app/intelligence.js
          node tests/ui_smoke_v320.js
      - name: Research exhaustive
        run: python scripts/research_supervisor.py --profile exhaustive --max-runtime 3300 --fallback-runtime 300
      - name: Validate output
        run: python scripts/validate.py
      - name: Publish canonical intelligence only
        run: >-
          python scripts/publish_research_update.py --message "chore: inteligencia exhaustiva mensual" --attempts 3
