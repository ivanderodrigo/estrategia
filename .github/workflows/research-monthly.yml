name: Inteligencia exhaustiva mensual

on:
  workflow_dispatch:
  schedule:
    # Día 1 de cada mes: barrido long-tail e histórico.
    - cron: "17 2 1 * *"

permissions:
  contents: write

concurrency:
  group: westcon-public-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install requests
      - name: Preflight offline del motor y la UI
        run: |
          python -m py_compile scripts/research.py scripts/validate.py scripts/selftest.py
          python scripts/selftest.py
          node --check assets/app.js
          node scripts/ui_smoke.js
      - name: Barrido exhaustivo mensual
        env:
          RESEARCH_PROFILE: exhaustive
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          BASE_API_TOKEN: ${{ secrets.BASE_API_TOKEN }}
        run: python scripts/research.py --profile=exhaustive
      - name: Validar dataset antes de publicar
        run: python scripts/validate.py
      - name: Guardar actualización
        run: |
          git config user.name "westcon-strategy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.latest.json data/research_status.json data/changes.latest.json data/history/
          git diff --cached --quiet || git commit -m "chore: inteligencia exhaustiva mensual"
          git pull --rebase origin main
          git push origin HEAD:main
