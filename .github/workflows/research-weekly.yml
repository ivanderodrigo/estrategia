name: Investigación estratégica profunda semanal

on:
  workflow_dispatch:
  schedule:
    # Generado por scripts/configure_updates.py; la guardia elige horario de verano/invierno.
    # BEGIN CONFIGURABLE_SCHEDULE
    - cron: "47 2 * * 0"
    - cron: "47 3 * * 0"
    # END CONFIGURABLE_SCHEDULE

permissions:
  contents: write

concurrency:
  group: westcon-public-intelligence
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comprobar calendario local
        id: schedule
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: python scripts/schedule_guard.py --profile deep
      - name: Dependencias
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Preflight offline del motor v3.11 y la UI v3.11.0
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m py_compile scripts/research.py scripts/configure_updates.py scripts/schedule_guard.py scripts/research_supervisor_v33.py scripts/research_supervisor_v38.py scripts/research_supervisor_v39.py scripts/research_supervisor_v311.py scripts/v34/*.py scripts/v38/*.py scripts/v39/*.py scripts/v311/*.py
          python scripts/test_resilience.py
          python scripts/test_schedule.py
          python -m unittest tests/test_v311.py
          python scripts/v311/validate_v311.py
          node --check assets/v311/intelligence.js
          node tests/ui_smoke_v311.js
      - name: Investigación profunda
        if: steps.schedule.outputs.run == 'true'
        env:
          RESEARCH_PROFILE: deep
        run: python scripts/research_supervisor_v311.py --profile deep --max-runtime 1800 --fallback-runtime 240
      - name: Conservar diagnóstico de ejecución
        if: always() && steps.schedule.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: research-diagnostic-weekly-${{ github.run_id }}
          path: |
            data/v31/
            data/v32/
            data/v33/
            data/v34/
            data/v37/
            data/v38/
            data/v39/
            data/v311/
            diagnostics/*.log
            data/run_manifest.latest.json
            data/supervisor.latest.json
            data/research_errors.json
            data/source_health.json
            data/discovered_entities.json
            data/research_status.json
            data/research_queue.json
          if-no-files-found: warn
          retention-days: 45
      - name: Validar dataset antes de publicar
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/v311/validate_v311.py
      - name: Guardar actualización
        if: steps.schedule.outputs.run == 'true'
        run: |
          python scripts/publish_research_update.py --message "chore: inteligencia estratégica profunda semanal" --attempts 3
