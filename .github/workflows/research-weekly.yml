name: Westcon Intelligence Weekly

on:
  schedule:
    - cron: "29 4 * * 0"
  workflow_dispatch:

concurrency:
  group: westcon-intelligence-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    uses: ./.github/workflows/research-run.yml
    with:
      profile: deep
      max_runtime: 1800
      fallback_runtime: 240
      timeout_minutes: 50
      commit_message: "chore: inteligencia estratégica semanal"
