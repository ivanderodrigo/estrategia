name: Westcon Intelligence Weekly
on:
  schedule:
    - cron: '29 4 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: westcon-research-deep
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Canonical preflight
        run: |
          python -m py_compile engine/*.py engine/research/*.py scripts/*.py
          python -m unittest tests/test_v319.py tests/test_workflows.py
          python scripts/validate.py
          node --check assets/app/intelligence.js
          node tests/ui_smoke_v319.js
      - name: Research deep
        run: python scripts/research_supervisor.py --profile deep --max-runtime 1800 --fallback-runtime 240
      - name: Validate output
        run: python scripts/validate.py
      - name: Publish canonical intelligence only
        run: python scripts/publish_research_update.py --message "chore: inteligencia estratégica semanal" --attempts 3
