name: Westcon Intelligence Weekly

on:
  # Run on schedule; changed watchdog code is validated by Fast CI and
  # deployed into the next queued research job. A push to the supervisor
  # must not enqueue an additional 65-minute deep run while the shared
  # evidence/research queue already contains work.
  push:
    branches: [main]
    paths:
      - 'engine/westcon_current_evidence.py'
  schedule:
    # Deep source corroboration four evenings/week, away from weekday Daily.
    - cron: "29 22 * * 0,1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    uses: ./.github/workflows/research-run.yml
    with:
      profile: deep
      max_runtime: 1800
      fallback_runtime: 240
      timeout_minutes: 65
      commit_message: "chore: inteligencia estratégica semanal"
