name: Westcon Intelligence Weekly

on:
  # Run a deep scan when its research policy/workflow is updated, as well as on schedule.
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-weekly.yml'
  schedule:
    # Deep source corroboration four evenings/week, away from weekday Daily.
    - cron: "29 22 * * 0,1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    uses: ./.github/workflows/research-run.yml
    with:
      profile: deep
      max_runtime: 1800
      fallback_runtime: 240
      timeout_minutes: 65
      commit_message: "chore: inteligencia estratégica semanal"
