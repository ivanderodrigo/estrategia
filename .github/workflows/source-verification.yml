name: Westcon Source Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-verification.yml'
      - 'scripts/publish_source_verification_status.py'
      - 'scripts/review_sources_live.py'
      - 'scripts/diagnose_source_http.py'
  schedule:
    - cron: "11 20 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Westcon Intelligence Daily'
      - 'Westcon Intelligence Weekly'
      - 'Westcon Intelligence Monthly'
      - 'Integrate Accredited Historical Evidence'
      - 'Westcon Exact TED CPV Recovery'
      - 'Restore Historical Source Links'
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: westcon-source-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit all published claim bindings
        run: python -m scripts.audit_claim_sources --output claim-source-audit.json > /dev/null
      - name: Review original source pages and all their individual citations
        env:
          REVIEW_EVENT: ${{ github.event_name }}
        run: |
          args=(--limit 200)
          if [[ "$REVIEW_EVENT" == schedule || "$REVIEW_EVENT" == push ]]; then
            args=(--all-references)
          fi
          python -m scripts.review_sources_live "${args[@]}" --output source-live-review.json
      - name: Diagnose source HTTP transport without treating HTTP success as proof
        if: always()
        run: |
          if [ -s source-live-review.json ]; then
            python scripts/diagnose_source_http.py
          fi
      - name: Publish source-verification telemetry tied to its snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-history"
          for workflow in research-daily.yml research-weekly.yml research-monthly.yml historical-source-diligence.yml source-verification.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/workflow-history/$workflow.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"workflow-history"
          runs=[]
          for path in d.glob("*.json"):
              runs.extend(json.loads(path.read_text(encoding="utf-8")).get("workflow_runs") or [])
          target=Path(os.environ["RUNNER_TEMP"])/"scheduled-runs.json"
          target.write_text(json.dumps({"workflow_runs":runs},ensure_ascii=False),encoding="utf-8")
          print("Scheduled history:",len(runs),"runs across five named workflows")
          PY
          python scripts/publish_source_verification_status.py \
            --run-url "$VERIFICATION_RUN_URL" \
            --workflow-runs "$RUNNER_TEMP/scheduled-runs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/public/source_verification_status.json "$RUNNER_TEMP/source_verification_status.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! jq -e --slurpfile current data/public/manifest.json '.snapshot_generated_at == $current[0].generated_at' "$RUNNER_TEMP/source_verification_status.json" >/dev/null; then
              echo "A newer snapshot has its own verification run. Keeping this sample in the workflow artifact."
              exit 0
            fi
            cp "$RUNNER_TEMP/source_verification_status.json" data/public/source_verification_status.json
            git add data/public/source_verification_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit: publish sampled source-verification status [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Cannot safely publish verification telemetry on current main"
          exit 1
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-source-verification
          path: |
            claim-source-audit.json
            source-live-review.json
            source-http-diagnostics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail closed if no source content was retrievable
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=Path("source-live-review.json")
          if not report.exists():
              raise SystemExit("Source review report missing; review did not complete")
          payload=json.loads(report.read_text(encoding="utf-8"))
          rows=payload.get("items") or []
          if not rows:
              raise SystemExit("No source references were reviewed; do not claim healthy verification")
          reachable=sum(str(x.get("review_status") or "").startswith("page_") for x in rows)
          if reachable == 0:
              raise SystemExit("Source review degraded: 0 readable pages. Telemetry is published, but verification is NOT healthy")
          print(f"Source content readable for {reachable}/{len(rows)} sampled references (NOT factual accreditation)")
          PY
