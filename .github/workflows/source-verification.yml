name: Westcon Source Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-verification.yml'
      - 'scripts/publish_source_verification_status.py'
  schedule:
    - cron: "11 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: westcon-source-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit all published claim bindings
        run: python -m scripts.audit_claim_sources --output claim-source-audit.json > /dev/null
      - name: Inspect a rotating set of original source pages
        run: python -m scripts.review_sources_live --limit 200 --output source-live-review.json
      - name: Publish source-verification telemetry tied to its snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/workflow-history"
          for workflow in research-daily.yml research-weekly.yml research-monthly.yml historical-source-diligence.yml source-verification.yml; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=schedule&per_page=20" > "$RUNNER_TEMP/workflow-history/$workflow.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=Path(os.environ["RUNNER_TEMP"])/"workflow-history"
          runs=[]
          for path in d.glob("*.json"):
              runs.extend(json.loads(path.read_text(encoding="utf-8")).get("workflow_runs") or [])
          target=Path(os.environ["RUNNER_TEMP"])/"scheduled-runs.json"
          target.write_text(json.dumps({"workflow_runs":runs},ensure_ascii=False),encoding="utf-8")
          print("Scheduled history:",len(runs),"runs across five named workflows")
          PY
          python scripts/publish_source_verification_status.py \
            --run-url "$VERIFICATION_RUN_URL" \
            --workflow-runs "$RUNNER_TEMP/scheduled-runs.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/public/source_verification_status.json "$RUNNER_TEMP/source_verification_status.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/source_verification_status.json" data/public/source_verification_status.json
            git add data/public/source_verification_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit: publish sampled source-verification status [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Cannot safely publish verification telemetry on current main"
          exit 1
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-source-verification
          path: |
            claim-source-audit.json
            source-live-review.json
          if-no-files-found: warn
          retention-days: 30
